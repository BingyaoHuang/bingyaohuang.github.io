<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Scientific and biomedical visual computing: schematic overview</title>
  <desc id="desc">Four conceptual illustrations for cryo-EM orientation, multi-view fish phenotyping, visual classification, and mixed-reality acupoint training. No experimental images or numerical results are depicted.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dce6ed" stroke-width="2"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#477f9e" stroke-width="1.5"/></marker>
    <g id="fish"><path d="M-140 0Q-45-85 110 0Q-45 85-140 0L-205-65V65Z" fill="#e6eff4" stroke="#477f9e" stroke-width="5"/><circle cx="70" cy="-9" r="7" fill="#31536b"/><path d="M-70-38L-15-70L10-40" fill="#d6e5ec" stroke="#477f9e" stroke-width="4"/></g>
  </defs>
  <rect width="1600" height="800" rx="16" fill="#f8fbfd"/>
  <path d="M800 20V780M20 400H1580" stroke="#cfdfd4" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173e56">
    <text x="44" y="70" font-size="48" font-weight="600">Cryo-EM</text>
    <text x="844" y="70" font-size="48" font-weight="600">Biological phenotyping</text>
    <text x="44" y="470" font-size="48" font-weight="600">Visual classification</text>
    <text x="844" y="470" font-size="48" font-weight="600">Mixed-reality training</text>
    <g transform="translate(60 108)">
      <rect width="200" height="200" rx="10" fill="url(#grid)" stroke="#b9cddd" stroke-width="3"/>
      <g fill="#8aabbc" stroke="#477f9e" stroke-width="3"><circle cx="83" cy="78" r="27"/><circle cx="116" cy="118" r="32"/><circle cx="71" cy="139" r="21"/><circle cx="133" cy="60" r="16"/></g>
      <path d="M235 100H310" stroke="#477f9e" stroke-width="6" marker-end="url(#arrow)"/>
      <g transform="translate(360 14)"><path d="M40 45L135 10L200 90L150 170L55 155L0 95Z" fill="#e5eee8" stroke="#6b927d" stroke-width="5"/><path d="M40 45L95 95L135 10M95 95L200 90M95 95L150 170M95 95L55 155M95 95L0 95" fill="none" stroke="#8aaa97" stroke-width="4"/><path d="M-20 190Q150 240 215 165" stroke="#477f9e" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g>
    </g>
    <g transform="translate(1090 220)">
      <use href="#fish"/>
      <g fill="#547361"><circle cx="-140" r="9"/><circle cx="-60" cy="-40" r="9"/><circle cx="110" r="9"/><circle cx="-60" cy="40" r="9"/></g>
      <path d="M-140 90H110M-140 75V105M110 75V105M-60-40V40" fill="none" stroke="#6b927d" stroke-width="4"/>
      <g transform="translate(290 0) scale(.57)"><use href="#fish"/><path d="M-180 95H100" fill="none" stroke="#6b927d" stroke-width="6"/></g>
    </g>
    <g transform="translate(208 610)">
      <g transform="translate(0 -30) scale(.65)"><use href="#fish"/></g>
      <g transform="translate(0 65) scale(.65 -.45)"><use href="#fish"/></g>
      <path d="M148 20H218" stroke="#477f9e" stroke-width="6" marker-end="url(#arrow)"/>
      <g fill="#e5eee8" stroke="#6b927d" stroke-width="5"><rect x="250" y="-35" width="80" height="80" rx="14"/><path d="M330 5H405M405 5V-55H470M405 5V80H470" fill="none"/><circle cx="490" cy="-55" r="25"/><circle cx="490" cy="80" r="25"/></g>
    </g>
    <g transform="translate(885 502)">
      <rect x="8" y="20" width="270" height="220" rx="14" fill="url(#grid)" stroke="#b9cddd" stroke-width="3"/>
      <g fill="#e6eff4" stroke="#477f9e" stroke-width="5"><circle cx="145" cy="65" r="35"/><path d="M110 103Q65 110 62 155L50 212M180 103Q220 112 225 155L240 212M110 106L99 224H190L180 106" fill="none"/></g>
      <g fill="#547361"><circle cx="120" cy="140" r="10"/><circle cx="168" cy="175" r="10"/><circle cx="115" cy="213" r="10"/></g>
      <path d="M305 133H380" stroke="#477f9e" stroke-width="6" marker-end="url(#arrow)"/>
      <g transform="translate(415 55)" fill="none" stroke="#6b927d" stroke-width="6"><rect width="185" height="150" rx="12"/><path d="M38 40L50 53L73 25M38 88L50 101L73 73M90 40H153M90 88H153"/></g>
    </g>
    <g font-size="36" fill="#526a79">
      <text x="44" y="365">Images → orientation → structure</text>
      <text x="844" y="365">Multiple views → morphology</text>
      <text x="44" y="765">Visual observations → evidence</text>
      <text x="844" y="765">Localization → practice → evaluation</text>
    </g>
  </g>
</svg>
